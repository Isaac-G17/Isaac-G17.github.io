spring:
  application:
    name: portfolio

  # Base de datos. Los valores por defecto coinciden con docker-compose.yml (solo para local).
  # En producción (Neon) se usa DB_SSLMODE=require.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USER:portfolio}
    password: ${DB_PASSWORD:portfolio}

  jpa:
    # El esquema lo crean las migraciones de Flyway, nunca Hibernate.
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Render asigna el puerto en la variable PORT.
server:
  port: ${PORT:8080}

# Solo se expone /actuator/health, sin detalles internos.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Documentación de la API: /v3/api-docs (JSON) y /swagger-ui.html (página interactiva).
springdoc:
  # Solo se documenta la API propia, no el health check de Actuator.
  paths-to-match: /api/**
  # Las respuestas correctas son JSON; sin esto Swagger las muestra como "*/*".
  default-produces-media-type: application/json
  swagger-ui:
    # Dentro de cada sección: primero GET, luego POST, PUT y DELETE.
    operations-sorter: method
