# Lint, tests y build del frontend en cada PR hacia develop o main.
name: Frontend

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    name: Lint, tests y build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci instala exactamente lo que dice package-lock.json
      - run: npm ci

      - run: npm run lint

      - run: npm test -- --watch=false

      - run: npm run build
