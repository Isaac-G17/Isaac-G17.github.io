# Build y tests del backend en cada PR hacia develop o main.
name: Backend

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    name: Build y tests
    runs-on: ubuntu-latest

    # Misma base de datos que docker-compose.yml, para los tests que la necesitan.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: portfolio
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify compila, corre los tests y empaqueta el .jar
      - run: ./mvnw --batch-mode verify
