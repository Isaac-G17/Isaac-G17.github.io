# Build y tests del backend en cada PR hacia develop o main.
name: Backend

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    name: Build y tests
    # Los tests de integración levantan su propio PostgreSQL con Testcontainers
    # (el runner ya trae Docker).
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify compila, corre los tests y empaqueta el .jar
      - run: ./mvnw --batch-mode verify
